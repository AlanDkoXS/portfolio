<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Respeta el tamaño de texto del sistema: Android/Chrome lo aplica al tamaño
         base (rem) en vez de hacer zoom a toda la página -->
    <meta name="text-scale" content="scale" />
    <!-- Tema: oscuro si el sistema está en modo oscuro; si no, por horario (oscuro de
         18:00 a 6:00, hora local). El botón guarda una excepción hasta el siguiente
         cambio (localStorage.theme / themeUntil).
         Se aplica antes de pintar; sin JS se sigue al sistema. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      {
        const h = new Date().getHours();
        let t = matchMedia('(prefers-color-scheme: dark)').matches || h >= 18 || h < 6 ? 'dark' : 'light';
        try {
          const o = localStorage.getItem('theme');
          if ((o === 'light' || o === 'dark') && Date.now() < Number(localStorage.getItem('themeUntil'))) t = o;
        } catch {}
        document.querySelector('meta[name="color-scheme"]').content = t;
      }
    </script>
    <title>Resume - Alan Quintana Pacheco</title>
    <meta name="description"
        content="Resume of Alan Quintana, full stack designer and web developer. View online or download in English or Spanish." />
    <link rel="canonical" href="https://alanquintana.pro/resume" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://alanquintana.pro/resume" />
    <meta property="og:title" content="Resume - Alan Quintana" />
    <meta property="og:description"
        content="Full stack designer and web developer. View online or download in English or Spanish." />
    <meta property="og:image" content="https://alanquintana.pro/assets/img/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="shortcut icon" href="/assets/img/logo.svg" type="image/x-icon" />
    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/main.css" />

    <!-- Fonts -->
    <link rel="preload" href="/assets/fonts/dm-sans/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/outfit/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/poppins/poppins-300-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Íconos: Boxicons va dentro de main.css; la fuente recortada pesa ~3 KB -->
    <link rel="preload" href="/assets/fonts/boxicons/boxicons.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Scripts -->
    <!-- Solo los módulos que usa esta página (main.js es para index.html) -->
    <script type="module">
        import { initFab } from '/assets/js/helpers/resume_fab_buttons.js';
        import { loadPdf } from '/assets/js/helpers/pdf_loader.js';
        import switchLanguages from '/assets/js/helpers/switchLanguages.js';
        import { setAutoDarkMode } from '/assets/js/helpers/auto-dark-mode.js';
        import lamp from '/assets/js/helpers/lamp.js';
        import navMenu from '/assets/js/helpers/nav_menu.js';
        import updateDateYear from '/assets/js/helpers/date_updater.js';
        import SnowEffect from '/assets/js/helpers/snow-effect.js';
        import { loadGoogleTagManager } from '/assets/js/helpers/google-tag-manager.js';

        loadGoogleTagManager();

        document.addEventListener('DOMContentLoaded', () => {
            initFab();
            loadPdf();
            switchLanguages();
            setAutoDarkMode();
            lamp();
            navMenu();
            updateDateYear();
            SnowEffect.init();
        });

        window.openModal = () => {
            document.getElementById('modal').showModal();
        };
    </script>
    <!-- pdf.js (módulo, lo importa pdf_loader.js): se adelanta la descarga sin
         bloquear el parseo. La versión debe coincidir con PDFJS_VERSION -->
    <link rel="modulepreload" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" crossorigin />
    <script>
        function downloadCV(language) {
            const fileMap = {
                ENG: '[ENG] Alan Quintana.pdf',
                ESP: '[ESP] Alan Quintana.pdf',
            };

            const fileName = fileMap[language];
            if (fileName) {
                const link = document.createElement('a');
                link.href = `/assets/docs/${fileName}`;
                link.download = fileName;
                link.click();
                document.getElementById('modal')?.close();
            } else {
                alert('Invalid language selected.');
            }
        }
    </script>
</head>

<body>
    <!-- Grano de fondo (el mismo del inicio), fijo debajo de la barra -->
    <div class="background-container bgGrain" aria-hidden="true"></div>
    <header class="header">
        <nav class="navbar grid--container flex--container">
            <a class="navbar__logo flex--container" href="/" data-i18n-attr="href:resumePage.homeHref">
                <svg class="logo">
                    <use xlink:href="/assets/img/logo.svg#logo"></use>
                </svg>
                <span class="resume__logo--name">alan</span>
                <span class="resume__logo--lastname">quintana</span>
            </a>
            <!-- Toggles -->
            <div id="nav" class="navbar__menu">
                <ul class="navbar__list flex--container">
                    <li class="navbar__item">
                        <a class="navbar__link active" href="/" data-i18n="resumePage.homeLink" data-i18n-attr="href:resumePage.homeHref">Home</a>
                    </li>
                </ul>
                <div class="navbar__toggles flex--container">
                    <div class="navbar__toggle--darkmode flex--container">
                        <input type="checkbox" name="theme" id="darkmode-toggle"
                            class="navbar__toggle--darkmode-input" title="Dark Mode" />
                        <label for="darkmode-toggle" class="navbar__toggle--darkmode-label">
                            <div class="icon-wrapper">
                                <i class="bx bx-sun navbar__toggle--darkmode-sun" aria-hidden="true"></i>
                                <i class="bx bx-moon navbar__toggle--darkmode-moon" aria-hidden="true"></i>
                            </div>
                        </label>
                    </div>
                    <div class="navbar__toggle--language flex--container">
                        <input type="checkbox" name="language-toggle" id="language-toggle"
                            class="navbar__toggle--language-input" title="Select Language"
                            aria-label="Select Language" />
                        <label for="language-toggle" class="navbar__toggle--language-label">
                            <div class="flag-wrapper">
                                <img src="/assets/img/flag-en.svg" class="navbar__toggle--language-en" lang="en" alt="English"
                                    loading="lazy" aria-hidden="true">
                                <img src="/assets/img/flag-es.svg" class="navbar__toggle--language-es" lang="es" alt="Español"
                                    loading="lazy" aria-hidden="true">
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            <!-- Nav Bar -->
            <a class="navbar__burger" href="#nav" aria-controls="nav" aria-expanded="false" data-i18n-attr="aria-label:navMenu;title:navMenu" aria-label="Menu" title="Menu"><i
                    class="bx bx-menu navbar__burger-open" aria-hidden="true"></i><i
                    class="bx bx-x navbar__burger-close" aria-hidden="true"></i></a>
        </nav>
    </header>
    <!-- Lámpara colgante (escritorio): cambia el tema. Encendida = modo claro -->
    <button
      type="button"
      class="lamp"
      aria-pressed="false"
      data-i18n-attr="aria-label:lamp;title:lamp"
      aria-label="Light"
      title="Light"
    >
      <span class="lamp__hit" aria-hidden="true"></span>
      <img class="lamp__off" src="/assets/img/lamp_button/button-lamp_lamp_original.webp" alt="" width="300" height="300" />
      <img class="lamp__over" src="/assets/img/lamp_button/button-lamp_lamp_over.webp" alt="" width="300" height="300" loading="lazy" />
      <img class="lamp__pull" src="/assets/img/lamp_button/button-lamp_lamp_clic.webp" alt="" width="300" height="300" loading="lazy" />
      <img class="lamp__on" src="/assets/img/lamp_button/button-lamp_lamp_active.webp" alt="" width="300" height="401" />
    </button>
    <!-- Buttons -->
    <div class="fab-container">
        <a href="#" class="fab btn btn--primary" id="btn-download" onclick="openModal(); return false;">
            <i class="bx bxs-download"></i>
            <span class="fab-text" data-i18n="resumePage.downloadButton">Download</span>
        </a>

        <dialog id="modal" closedby="any" aria-labelledby="download-title">
            <div class="modal-content">
                <form method="dialog">
                    <button class="modal__close" aria-label="Close" data-i18n-attr="aria-label:resumePage.close">
                        <i class="bx bx-x" aria-hidden="true"></i>
                    </button>
                </form>
                <h2 id="download-title" data-i18n="resumePage.downloadButton">Download</h2>
                <p data-i18n="resumePage.selectLanguage">Select language</p>
                <div class="resume__modal-content">
                    <button class="btn btn--primary" onclick="downloadCV('ENG')" autofocus>
                        <strong lang="en" data-i18n="resumePage.english">English</strong>
                    </button>
                    <button class="btn btn--primary" onclick="downloadCV('ESP')">
                        <strong lang="es" data-i18n="resumePage.spanish">Español</strong>
                    </button>
                </div>
            </div>
        </dialog>
    </div>
    <div id="pdf-container"></div>

    <footer class="footer section">
        <div class="footer__container grid--container">
            <div class="footer__info">
                <h3 class="footer__title">Alan Quintana</h3>
                <span class="footer__description" data-i18n="resumePage.footerDescription">
                    Made with ❤️ and ☕. Thanks to my tutor Alejandra Olazagasti.
                </span>
                <span class="footer__year"></span>
                <span class="footer__copyright" data-i18n="resumePage.footerCopyright">All rights reserved</span>
            </div>
            <div class="footer__social">
                <h3 class="footer__title">Social</h3>
                <ul class="footer__social-list">
                    <li class="footer__social-item">
                        <a class="footer__social-link" href="https://github.com/AlanDkoXS" target="_blank"
                            rel="noreferrer nofollow noopener" title="GitHub"><i class="bx bxl-github"></i></a>
                    </li>
                    <li class="footer__social-item">
                        <a class="footer__social-link" href="https://www.instagram.com/anotherguyontheroad/"
                            target="_blank" rel="noreferrer nofollow noopener" title="Instagram"><i
                                class="bx bxl-instagram"></i></a>
                    </li>
                    <li class="footer__social-item">
                        <a class="footer__social-link" href="https://x.com/AlanDKO" target="_blank"
                            rel="noreferrer nofollow noopener" title="Twitter"><i class="bx bxl-twitter"></i></a>
                    </li>
                    <li class="footer__social-item">
                        <a class="footer__social-link" href="https://www.linkedin.com/in/alanxs/" target="_blank"
                            rel="noreferrer nofollow noopener" title="LinkedIn"><i class="bx bxl-linkedin"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
